name: UI test (emulator)

# Full on-device test: run by hand before a release (Actions → UI test → Run workflow), or by pushing to the
# branch ui-test. It sends real texts to Android 14 and 15 emulators, checks which ones the app removes
# (in the phone's message store), drives every screen, takes screenshots and fails on any crash.
# Results go to the branch ui-results-<api>.
on:
  workflow_dispatch:
  push:
    branches: [ui-test]

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (minified, debug-signed)
        run: |
          BUILD_NUMBER=999999 gradle --no-daemon lintRelease assembleRelease || FAILED=1
          R=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if [ -f "$R" ]; then echo "===== lint report ====="; cat "$R"; fi
          [ -z "${FAILED:-}" ]

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Asia/Tehran
          disable-animations: true
          script: bash tests/ui/run.sh ${{ matrix.api }}

      - name: Publish screenshots to branch ui-results-${{ matrix.api }}
        if: always()
        run: |
          [ -d tests/ui/out ] || exit 0
          cp -r tests/ui/out "$RUNNER_TEMP/out"
          git config user.name "ui-test"
          git config user.email "ui-test@users.noreply.github.com"
          git checkout --orphan "ui-results-${{ matrix.api }}"
          git rm -rq --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/out/." .
          git add -A
          git commit -qm "UI test results, API ${{ matrix.api }}, run ${{ github.run_number }}"
          git push -f origin "HEAD:refs/heads/ui-results-${{ matrix.api }}"
