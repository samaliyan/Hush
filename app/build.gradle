plugins {
    id 'com.android.application'
}

// Release builds are signed with signing/hush.p12 when the SIGNING_PASSWORD secret is available
// (GitHub Actions). Without it (local builds, emulator tests) the debug key is used.
def signingPassword = System.getenv('SIGNING_PASSWORD')
def keyFile = rootProject.file('signing/hush.p12')
def useKey = signingPassword && keyFile.exists()

android {
    namespace 'io.github.samaliyan.hush'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.samaliyan.hush'
        minSdk 26
        targetSdk 34
        // Every GitHub build gets a higher number, so the in-app updater and Android accept it as newer.
        versionCode((System.getenv('BUILD_NUMBER') ?: '1') as int)
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (useKey) {
                storeFile keyFile
                storeType 'pkcs12'
                storePassword signingPassword
                keyAlias 'hush'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig useKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Version-freshness checks are not code problems.
        disable 'GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion'
    }
}
